[build-system]
requires = [
    "hatchling>=1.5.0",
]
build-backend = "hatchling.build"

[project]
name = "yara-mail"
description = "A Python package and command line utility for scanning emails with YARA rules"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Sean Whalen", email = "whalenster@gmail.com" },
]
keywords = [
    "YARA",
    "email",
    "security",
    "information security",
    "infosec",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Communications :: Email",
]
dependencies = [
    "mailsuite>=2.3.1",
    "pdftotext>=3.0.0",
    "simplejson>=4.1.0",
    "yara-python>=4.5.4",
]
dynamic = [
    "version",
]

[project.optional-dependencies]
build = [
    "hatch>=1.14.0",
    "myst-parser[linkify]",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
    "sphinx",
    "sphinx_rtd_theme",
]

[project.scripts]
yaramail = "yaramail._cli:_main"

[project.urls]
Homepage = "https://github.com/seanthegeek/yaramail"
Documentation = "https://seanthegeek.github.io/yaramail/"
Issues = "https://github.com/seanthegeek/yaramail/issues"
Changelog = "https://github.com/seanthegeek/yaramail/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "yaramail/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/yaramail",
]

[tool.hatch.build.targets.wheel]
packages = ["yaramail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["yaramail"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    # Typing overload stubs are declarations, never executed at runtime.
    "@overload",
]
# Full statement and branch coverage is required. Code that cannot
# meaningfully execute under the supported dependency floors should be
# removed or excluded above, not left untested.
fail_under = 100
