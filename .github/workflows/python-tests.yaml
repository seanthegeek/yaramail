name: Python tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get install -y build-essential libpoppler-cpp-dev pkg-config python3-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
          # Force the latest ruff and pyright so lint/type-check rules track
          # upstream and surface new issues promptly.
          pip install --upgrade ruff pyright

      - name: Lint with ruff
        run: ruff check yaramail tests

      - name: Check formatting with ruff
        run: ruff format --check yaramail tests

      - name: Type-check with pyright
        env:
          # Download whatever upstream tagged "latest" at run time, not the
          # version pinned inside the pyright wrapper wheel.
          PYRIGHT_PYTHON_FORCE_VERSION: latest
        run: pyright

      - name: Test building documentation
        run: |
          cd docs
          make html

      - name: Test building packages
        run: hatch build

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get install -y build-essential libpoppler-cpp-dev pkg-config python3-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: pytest
        run: pytest --cov=yaramail --cov-report=xml --cov-report=term --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        # Feeds Codecov Test Analytics (flaky-test detection, per-test
        # history). Runs even on test failure so failed cases still report.
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
